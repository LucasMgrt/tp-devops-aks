apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mon-app
  labels:
    app: mon-app
spec:
  ingressClassName: contour
  rules:
    - host: lucas.IP_INGRESS.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mon-app
                port:
                  name: http
