apiVersion: apps/v1
kind: Deployment
metadata:
  name: mon-app
  labels:
    app: mon-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mon-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mon-app
    spec:
      containers:
        - name: mon-app
          image: ghcr.io/lucasmgrt/tp-devops-aks:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: mon-app-config
          # Incident n°3 : 16Mi/32Mi imposés => OOMKilled en boucle.
          # Mesure : gunicorn (maître + 2 workers) ~57 Mio au repos.
          # Mémoire relevée avec une marge x2, CPU inchangé.
          # Rolling update : 3 pods x 128Mi = 384Mi, à confronter au quota.
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
